name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/**"
      - ".env.production"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install pnpm
        run: npm install -g pnpm@11.25.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: |
          pnpm --filter "./packages/*" build
          pnpm --filter @latex-collab/web build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== DIST FILES ===" > deploy.log
          ls -la apps/web/dist >> deploy.log
          cat apps/web/dist/index.html >> deploy.log
          echo "=== CLOUDFLARE PAGES PROJECTS ===" >> deploy.log
          npx --yes wrangler@^4 pages project list >> deploy.log 2>&1 || true
          echo "=== ATTEMPT DEPLOY latex-editor-do7 ===" >> deploy.log
          npx --yes wrangler@^4 pages deploy apps/web/dist --project-name=latex-editor-do7 --branch=main --commit-dirty=true >> deploy.log 2>&1 || true
          echo "=== ATTEMPT DEPLOY latex-editor ===" >> deploy.log
          npx --yes wrangler@^4 pages deploy apps/web/dist --project-name=latex-editor --branch=main --commit-dirty=true >> deploy.log 2>&1 || true
          cat deploy.log

      - name: Upload deploy log to branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B deploy-status
          git add deploy.log -f
          git commit -m "chore: update deploy log [skip ci]" || true
          git push origin deploy-status --force || true
