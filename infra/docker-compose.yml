name: latex-workspace-s00
services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: latex
      POSTGRES_USER: latex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm env:init}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U latex -d latex"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  minio:
    build: { context: ./minio }
    image: latex-workspace-minio:7aac2a2
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Run pnpm env:init}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Run pnpm env:init}
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_ORIGIN:?Run pnpm env:init}
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: ["s3-data:/data"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30
  mailpit:
    image: axllent/mailpit@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    ports: ["127.0.0.1:58025:8025", "127.0.0.1:51025:1025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  pg-data:
  redis-data:
  s3-data:
